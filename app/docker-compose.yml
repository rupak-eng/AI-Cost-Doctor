# AI Cost Doctor — local/dev compose stack.
#   cp .env.example .env   # then fill in JWT_SECRET / FERNET_KEY
#   docker compose up --build
#
# Services: postgres:16 (named volume), api (FastAPI), worker (same image,
# APScheduler entrypoint), web (Next.js frontend — built by the frontend
# phase; the directory does not exist yet in Phase 1).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_cost_doctor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_cost_doctor"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_cost_doctor
    entrypoint: ["sh", "/code/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_cost_doctor
    entrypoint: ["sh", "/code/entrypoint.sh"]
    # entrypoint runs migrations (no-op after api) then execs this:
    command: ["python", "-m", "app.worker"]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
